<style>

  :root {
    --bg: #f8faf7;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #5f8f62;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition:
      background 0.35s ease,
      color 0.35s ease;
  }

  header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    transition: all 0.35s ease;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
  }

  .logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: white;
    font-size: 24px;
    box-shadow: 0 0 25px rgba(74,222,128,0.35);
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }

  .status {
    color: var(--accent);
    font-size: 14px;
  }

  .clear,
  .theme-select {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 600;
    backdrop-filter: blur(16px);
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    padding-bottom: 150px;
    gap: 14px;
    overflow-y: auto;
  }

  #log {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .welcome {
    margin-top: 40px;
    padding: 28px 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    text-align: center;
    background: var(--panel);
    backdrop-filter: blur(22px);
    animation: fadeIn 0.8s ease;
    transition: all 0.35s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .welcome h1 {
    font-size: 30px;
    margin: 10px 0;
  }

  .welcome p {
    color: var(--muted);
    line-height: 1.5;
    font-size: 16px;
  }

  .bubble {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 18px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: fadeIn 0.25s ease;
    backdrop-filter: blur(18px);
  }

  .user {
    align-self: flex-end;
    background: rgba(74,222,128,0.14);
    border: 1px solid rgba(74,222,128,0.18);
  }

  .bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  form {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    border-top: 1px solid var(--border);
    position: fixed;
    left: 0;
    right: 0;
    bottom: 75px;
    z-index: 999;
    backdrop-filter: blur(25px);
  }

  input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    outline: none;
  }

  input::placeholder {
    color: var(--muted);
  }

  button {
    border: 0;
    border-radius: 14px;
    padding: 0 18px;
    background: var(--accent);
    color: white;
    font-weight: 800;
    font-size: 16px;
    transition:
      transform 0.2s ease,
      opacity 0.2s ease;
  }

  button:hover {
    transform: translateY(-2px);
    opacity: 0.92;
  }

  /* THEMES */

  body[data-theme="light"] {
    --bg: #f8faf7;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #5f8f62;
  }

  body[data-theme="dark"] {
    --bg: #0f172a;
    --panel: #111827;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
    --accent: #22c55e;
  }

  body[data-theme="black-glass"] {
    --bg:
      radial-gradient(circle at top left, rgba(74,222,128,0.15), transparent 25%),
      radial-gradient(circle at bottom right, rgba(56,189,248,0.12), transparent 25%),
      linear-gradient(135deg, #050816 0%, #0b1120 45%, #020617 100%);
    --panel: rgba(15, 23, 42, 0.72);
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: rgba(255,255,255,0.14);
    --accent: #4ade80;
  }

  body[data-theme="emerald"] {
    --bg: #030712;
    --panel: rgba(6, 78, 59, 0.28);
    --text: #ecfdf5;
    --muted: #a7f3d0;
    --border: rgba(74,222,128,0.25);
    --accent: #34d399;
  }

  body[data-theme="cyber"] {
    --bg: #020617;
    --panel: rgba(8, 47, 73, 0.4);
    --text: #e0f2fe;
    --muted: #7dd3fc;
    --border: rgba(56,189,248,0.3);
    --accent: #38bdf8;
  }

  body[data-theme="calm"] {
    --bg: #f0fdf4;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #d1fae5;
    --accent: #86efac;
  }

  body[data-theme="luxury"] {
    --bg: #050505;
    --panel: #111111;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --border: #292524;
    --accent: #d4af37;
  }

  @media (max-width: 520px) {

    form {
      bottom: 85px;
    }

    .welcome h1 {
      font-size: 26px;
    }

    button {
      min-width: 70px;
    }

    .header-actions {
      flex-direction: column;
      align-items: flex-end;
    }
  }

</style>
