<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Spring Virtual Office</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f8faf7;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #5f8f62;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-size: 23px;
    }

    .title {
      font-weight: 800;
      font-size: 18px;
    }

    .status {
      color: var(--accent);
      font-size: 13px;
    }

    .clear {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 12px;
      font-weight: 700;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 110px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .welcome {
      margin-top: 40px;
      padding: 28px 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      text-align: center;
    }

    .welcome h1 {
      font-size: 27px;
      margin: 10px 0;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.5;
    }

    .bubble {
      max-width: 86%;
      padding: 13px 15px;
      border-radius: 18px;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #dbeafe;
    }

    .bot {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    form {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 70px;
      z-index: 9999;
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      font-size: 16px;
    }

    @media (max-width: 520px) {
      form {
        bottom: 82px;
      }

      .clear {
        font-size: 13px;
        padding: 8px 10px;
      }

      .title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="logo">🌿</div>
      <div>
        <div class="title">Spring Virtual Office</div>
        <div class="status">● AI Assistant · Online</div>
      </div>
    </div>

    <button class="clear" onclick="clearChat()">Clear</button>
  </header>

  <main id="log">
    <div class="welcome" id="welcome">
      <div style="font-size:42px;">🌿</div>
      <h1>Welcome to Spring Virtual Office</h1>
      <p>I'm your AI assistant. Ask me anything, book an appointment, request support, or just chat.</p>
    </div>
  </main>

  <form id="chatForm">
    <input id="message" type="text" placeholder="Type your message..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const log = document.getElementById("log");

    function addBubble(text, type) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      const bubble = document.createElement("div");
      bubble.className = "bubble " + type;
      bubble.textContent = text;
      log.appendChild(bubble);
      log.scrollTop = log.scrollHeight;
    }

    function clearChat() {
      log.innerHTML = `
        <div class="welcome" id="welcome">
          <div style="font-size:42px;">🌿</div>
          <h1>Welcome to Spring Virtual Office</h1>
          <p>History cleared. I'm ready to help — ask me anything!</p>
        </div>
      `;
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addBubble(message, "user");
      input.value = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        addBubble(data.reply || "SpringBot is online, but I could not read that response.", "bot");
      } catch (error) {
        addBubble("Connection issue. Please try again.", "bot");
      }
    });
  </script>
</body>
</html>
