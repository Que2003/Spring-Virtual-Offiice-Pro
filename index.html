<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Spring Virtual Office</title>

  <style>

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    :root{

      --bg:
        radial-gradient(circle at top left,
        rgba(74,222,128,0.14),
        transparent 25%),

        radial-gradient(circle at bottom right,
        rgba(56,189,248,0.12),
        transparent 25%),

        linear-gradient(
          135deg,
          #050816 0%,
          #0b1120 45%,
          #020617 100%
        );

      --panel:rgba(15,23,42,0.68);

      --panel-solid:#0f172a;

      --text:#f8fafc;

      --muted:#94a3b8;

      --border:rgba(255,255,255,0.12);

      --accent:#4ade80;

      --accent2:#38bdf8;

    }

    body{

      margin:0;

      font-family:
        Inter,
        Arial,
        sans-serif;

      background:var(--bg);

      color:var(--text);

      height:100dvh;

      overflow:hidden;

      display:flex;

      flex-direction:column;

      backdrop-filter:blur(12px);

    }

    body::before{

      content:"";

      position:fixed;

      inset:0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size:40px 40px;

      pointer-events:none;

      mask-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.8),
          transparent 90%
        );

    }

    header{

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:12px;

      padding:16px;

      border-bottom:1px solid var(--border);

      background:rgba(2,6,23,0.7);

      backdrop-filter:blur(20px);

      position:sticky;

      top:0;

      z-index:1000;

    }

    .brand{

      display:flex;

      align-items:center;

      gap:12px;

    }

    .logo{

      width:52px;

      height:52px;

      border-radius:18px;

      display:grid;

      place-items:center;

      background:
        linear-gradient(
          145deg,
          rgba(74,222,128,0.25),
          rgba(56,189,248,0.14)
        );

      border:1px solid rgba(255,255,255,0.15);

      font-size:26px;

      box-shadow:
        0 0 35px rgba(74,222,128,0.22);

      animation:
        float 5s ease-in-out infinite;

    }

    @keyframes float{

      0%,100%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-4px);
      }

    }

    .title{

      font-size:22px;

      font-weight:800;

      letter-spacing:-0.03em;

    }

    .status{

      color:var(--accent);

      font-size:14px;

      margin-top:2px;

    }

    .header-actions{

      display:flex;

      gap:10px;

      align-items:center;

    }

    .theme-select,
    .clear{

      border:1px solid var(--border);

      background:rgba(255,255,255,0.06);

      color:var(--text);

      border-radius:999px;

      padding:10px 14px;

      font-weight:700;

      backdrop-filter:blur(20px);

    }

    main{

      flex:1;

      overflow-y:auto;

      padding:18px;

      padding-bottom:220px;

      display:flex;

      flex-direction:column;

      gap:14px;

      scroll-behavior:smooth;

    }

    .welcome{

      margin-top:50px;

      padding:36px 22px;

      border-radius:30px;

      border:1px solid var(--border);

      background:var(--panel);

      backdrop-filter:blur(25px);

      text-align:center;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.35);

      animation:
        fadeIn 0.7s ease;

    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(12px);
      }

      to{
        opacity:1;
        transform:translateY(0px);
      }

    }

    .welcome-icon{

      font-size:52px;

      margin-bottom:12px;

    }

    .welcome h1{

      margin:0;

      font-size:44px;

      line-height:1.05;

      letter-spacing:-0.06em;

    }

    .welcome p{

      color:var(--muted);

      margin-top:16px;

      font-size:18px;

      line-height:1.7;

    }

    .bubble{

      max-width:85%;

      padding:14px 16px;

      border-radius:22px;

      line-height:1.5;

      word-wrap:break-word;

      animation:
        bubbleIn 0.22s ease;

      backdrop-filter:blur(20px);

    }

    @keyframes bubbleIn{

      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0px);
      }

    }

    .user{

      align-self:flex-end;

      background:
        linear-gradient(
          135deg,
          rgba(74,222,128,0.22),
          rgba(56,189,248,0.18)
        );

      border:1px solid rgba(74,222,128,0.22);

    }

    .bot{

      align-self:flex-start;

      background:var(--panel);

      border:1px solid var(--border);

    }

    form{

      position:fixed;

      left:0;

      right:0;

      bottom:110px;

      z-index:9999;

      display:flex;

      gap:12px;

      padding:14px;

      background:
        rgba(2,6,23,0.78);

      backdrop-filter:blur(25px);

      border-top:1px solid var(--border);

    }

    input{

      flex:1;

      min-width:0;

      border:1px solid var(--border);

      border-radius:18px;

      padding:16px;

      font-size:16px;

      color:var(--text);

      background:
        rgba(255,255,255,0.06);

      outline:none;

    }

    input::placeholder{

      color:var(--muted);

    }

    button{

      border:0;

      border-radius:18px;

      padding:0 20px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      color:white;

      font-weight:800;

      font-size:16px;

      min-width:82px;

      box-shadow:
        0 0 30px rgba(74,222,128,0.18);

    }

    button:active{

      transform:scale(0.98);

    }

    body[data-theme="light"]{

      --bg:#f8faf7;
      --panel:#ffffff;
      --panel-solid:#ffffff;
      --text:#1f2933;
      --muted:#6b7280;
      --border:#e5e7eb;
      --accent:#5f8f62;
      --accent2:#38bdf8;

    }

    body[data-theme="emerald"]{

      --bg:
        linear-gradient(
          135deg,
          #03120d,
          #071a14,
          #020617
        );

      --panel:
        rgba(6,78,59,0.28);

      --panel-solid:#052e2b;

      --text:#ecfdf5;

      --muted:#a7f3d0;

      --border:
        rgba(74,222,128,0.18);

      --accent:#34d399;

      --accent2:#4ade80;

    }

    body[data-theme="cyber"]{

      --bg:
        linear-gradient(
          135deg,
          #020617,
          #081120,
          #071a2f
        );

      --panel:
        rgba(8,47,73,0.4);

      --panel-solid:#082f49;

      --text:#e0f2fe;

      --muted:#7dd3fc;

      --border:
        rgba(56,189,248,0.25);

      --accent:#38bdf8;

      --accent2:#22d3ee;

    }

    body[data-theme="luxury"]{

      --bg:
        linear-gradient(
          135deg,
          #050505,
          #111111,
          #050505
        );

      --panel:
        rgba(24,24,27,0.78);

      --panel-solid:#18181b;

      --text:#fafaf9;

      --muted:#a8a29e;

      --border:#292524;

      --accent:#d4af37;

      --accent2:#facc15;

    }

    @media (max-width:700px){

      .title{

        font-size:18px;

      }

      .welcome{

        margin-top:30px;

        padding:30px 18px;

      }

      .welcome h1{

        font-size:28px;

      }

      .welcome p{

        font-size:16px;

      }

      form{

        bottom:135px;

      }

      .header-actions{

        flex-direction:column;

        align-items:flex-end;

      }

      .theme-select,
      .clear{

        font-size:12px;

        padding:8px 10px;

      }

    }

  </style>

</head>

<body data-theme="black-glass">

  <header>

    <div class="brand">

      <div class="logo">
        🌿
      </div>

      <div>

        <div class="title">
          Spring Virtual Office
        </div>

        <div class="status">
          ● AI Assistant · Online
        </div>

      </div>

    </div>

    <div class="header-actions">

      <select
        id="themeSelect"
        class="theme-select"
      >

        <option value="black-glass">
          Black Glass
        </option>

        <option value="light">
          Light
        </option>

        <option value="emerald">
          Emerald
        </option>

        <option value="cyber">
          Cyber
        </option>

        <option value="luxury">
          Luxury
        </option>

      </select>

      <button
        class="clear"
        onclick="clearChat()"
      >
        Clear
      </button>

    </div>

  </header>

  <main id="log">

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        🌿
      </div>

      <h1>
        Welcome to Spring Virtual Office
      </h1>

      <p>
        Your futuristic AI workspace is online.
        Ask questions, book appointments,
        request support, or just chat with SpringBot.
      </p>

    </div>

  </main>

  <form id="chatForm">

    <input
      id="message"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    />

    <button type="submit">
      Send
    </button>

  </form>

  <script>

    const form =
      document.getElementById("chatForm");

    const input =
      document.getElementById("message");

    const log =
      document.getElementById("log");

    const themeSelect =
      document.getElementById("themeSelect");

    const savedTheme =
      localStorage.getItem("springTheme")
      || "black-glass";

    document.body.setAttribute(
      "data-theme",
      savedTheme
    );

    themeSelect.value = savedTheme;

    themeSelect.addEventListener(
      "change",
      () => {

        const theme =
          themeSelect.value;

        document.body.setAttribute(
          "data-theme",
          theme
        );

        localStorage.setItem(
          "springTheme",
          theme
        );

      }
    );

    function addBubble(text,type){

      const welcome =
        document.getElementById("welcome");

      if(welcome){
        welcome.remove();
      }

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble " + type;

      bubble.textContent =
        text;

      log.appendChild(bubble);

      log.scrollTop =
        log.scrollHeight;

    }

    function clearChat(){

      log.innerHTML = `
        <div class="welcome" id="welcome">

          <div class="welcome-icon">
            🌿
          </div>

          <h1>
            Welcome to Spring Virtual Office
          </h1>

          <p>
            History cleared.
            I'm ready to help.
          </p>

        </div>
      `;

    }

    form.addEventListener(
      "submit",
      async function(e){

        e.preventDefault();

        const message =
          input.value.trim();

        if(!message) return;

        addBubble(
          message,
          "user"
        );

        input.value = "";

        try{

          const response =
            await fetch(
              "/api/chat",
              {
                method:"POST",

                headers:{
                  "Content-Type":
                  "application/json"
                },

                body:JSON.stringify({
                  message:message
                })
              }
            );

          const data =
            await response.json();

          addBubble(
            data.reply ||
            "SpringBot could not respond.",
            "bot"
          );

        }catch(error){

          addBubble(
            "Connection issue. Please try again.",
            "bot"
          );

        }

      }
    );

  </script>

</body>
</html>
